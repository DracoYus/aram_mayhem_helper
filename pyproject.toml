[project]
name = "aram-mayhem-helper"
version = "0.1.0"
description = "A helper tool for ARAM Mayhem mode in League of Legends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "numpy>=1.26,<2.0",  # paddleocr 2.9.1 锁定 numpy<2.0
    "requests>=2.32.5",
]
authors = [{ name = "DracoYu", email = "876319691@qq.com" }]

[project.optional-dependencies]
# 屏幕 OCR 识别（GUI / recommend 命令需要）；web 部署无需安装
ocr = [
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",
    "Pillow>=10.0.0",
    "screeninfo>=0.8.1",
    "setuptools>=82.0.0",
]

[project.scripts]
aram-mayhem-helper = "aram_mayhem_helper.cli:cli_main"
main = "aram_mayhem_helper.cli:cli_main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "requests-mock>=1.12",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # E=pycodestyle F=pyflakes I=import排序
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=aram_mayhem_helper", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["aram_mayhem_helper"]
omit = ["*/gui.py", "*/ocr/ocr_tool.py"]

[tool.coverage.report]
fail_under = 80
