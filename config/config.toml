[crawler]
timeout = 30
delay_second = 2
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36"

[crawler.opgg.aram_augment]
base_url = "https://lol-api-champion.op.gg/api/contents/stats/champions/{0}/aram-augments"
save_directory = "opgg/aram_augments/"
# 可以添加更多URL配置

[crawler.ddragon.champion]
base_url = "https://ddragon.leagueoflegends.com/cdn/{0}/data/en_US/champion.json"
save_directory = "ddragon/champions/"

[crawler.aramkit]
# 版本发现首页（数据版本号内嵌在页面 HTML 中，无 versions API）
homepage_url = "https://aramkit.com/zh-CN/"

[crawler.aramkit.aram_augment]
data_base_url = "https://data.aramkit.com/data/"
# 数据集: "all" 全体 / "high" 高分段
dataset = "all"
save_directory = "aramkit/aram_augments/"

[crawler.aramkit.resources]
resources_base_url = "https://data.aramkit.com/resources/"
language = "zh-CN"
save_directory = "aramkit/resources/"

[ocr]
# 调试模式：打开后每次识别都会把三个区域（符文槽位）的截图保存到 logs/ocr_debug/，
# 用于排查 OCR 区域坐标是否对准游戏界面（配合 ocr_tool.py 的 REGIONS 调整）
debug_save_captures = false

[data_source]
# 推荐引擎/GUI/网页默认数据源: "opgg" | "aramkit"
source = "aramkit"

[suggest]
# 贝叶斯收缩参数：τ = median(pop > 0) × tau_factor
# 越小越信任低出场率符文的原始表现
shrinkage_tau_factor = 0.5
# Sigmoid 陡峭度：>1 拉大分数差距，<1 压缩分数差距
sigmoid_steepness = 1.0
# 分数阈值（sigmoid 输出在 [0,1]，0.5 = 组平均水平，0.7 ≈ top 5）
immediate_select_score_threshold = 0.70
consider_select_score_threshold = 0.50
# 排名阈值（百分比，0.1 ≈ 组内前 5 名）
# 键名使用正确拼写 percentage
immediate_select_percentage_threshold = 0.10
consider_select_percentage_threshold = 0.30

[auto_watch]
# 自动监听：检测到符文选择界面时自动执行推荐并展示结果（GUI 悬浮窗 / CLI 控制台）
# enabled 仅影响 GUI/CLI 启动时是否自动开始监听（GUI 内可随时手动开关）
enabled = false
# 轮询间隔（秒）
poll_interval = 2.0
# 连续命中判据 N 次才触发（过滤回城特效/死亡灰屏等过渡帧误判）
debounce_count = 2
# 像素判别阈值：区域灰度 mean < mean_threshold 且 std > std_threshold
# （选择界面 = 暗背景 + 高对比白字；实测两组样本间隔见 auto/detection.py 注释）
mean_threshold = 60.0
std_threshold = 40.0
